<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps — список записей</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">ПРАКТИЧЕСКАЯ РАБОТА №2</p>
    <h1>Docker Compose</h1>
    <p>Небольшое приложение Go, подключённое к PostgreSQL.</p>
    <div class="status" id="status">Загрузка данных…</div>
    <ul id="items"></ul>
    <button id="reload">Обновить список</button>
    <p class="hint">Данные загружаются из PostgreSQL через <code>/api/items</code>.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
